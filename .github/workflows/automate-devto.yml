name: DEV Automate package
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    paths:
      - 'automate/**'
      - '.github/workflows/automate-devto.yml'
  pull_request:
    paths:
      - 'automate/**'
      - '.github/workflows/automate-devto.yml'
  workflow_dispatch:

jobs:
  umbraco-17-and-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test on Umbraco 17 and 18
        run: ./automate/DevTo/test-umbraco-compat.sh
