# Renders the CRT profile (README, assets/, demo/data.json) once a day.
name: Update CRT profile
on:
  schedule: [{cron: '0 6 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Render CRT assets (stdlib only, no pip install)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # use a PAT with read:user if you want private contributions counted
        run: python scripts/crt_render.py --user OwainWilliams
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md assets demo/data.json
          git diff --cached --quiet || git commit -m "chore: refresh CRT profile"
          git push
