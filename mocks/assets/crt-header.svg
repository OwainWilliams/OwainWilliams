<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Retro green-screen terminal showing: Owain Williams, Senior .NET Developer, Umbraco, Scotland, open to collaborate">
<style>
text{font-family:'Courier New', Courier, monospace;fill:#33ff66;}
.flick{animation:flick 6s infinite steps(1);}
@keyframes flick{0%,100%{opacity:1}41%{opacity:.96}42%{opacity:.88}43%{opacity:1}77%{opacity:.95}78%{opacity:1}}
.roll{animation:roll .6s linear infinite;}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(4px)}}
.sweep{animation:sweep 7s linear infinite;}
@keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(400px)}}
.cur{animation:blink 1s steps(1) infinite;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important} .typed{width:100% !important}}
@keyframes t0{0%,2.78%{width:0}12.03%,94%{width:792px}100%{width:0}}
.l0{animation:t0 18.0s infinite steps(37);}
@keyframes t1{0%,8.61%{width:0}15.86%,94%{width:792px}100%{width:0}}
.l1{animation:t1 18.0s infinite steps(29);}
@keyframes t2{0%,14.44%{width:0}21.44%,94%{width:792px}100%{width:0}}
.l2{animation:t2 18.0s infinite steps(28);}
@keyframes t4{0%,26.11%{width:0}31.36%,94%{width:792px}100%{width:0}}
.l4{animation:t4 18.0s infinite steps(21);}
@keyframes t5{0%,31.94%{width:0}36.94%,94%{width:792px}100%{width:0}}
.l5{animation:t5 18.0s infinite steps(20);}
@keyframes t6{0%,37.78%{width:0}45.03%,94%{width:792px}100%{width:0}}
.l6{animation:t6 18.0s infinite steps(29);}
@keyframes t7{0%,43.61%{width:0}52.61%,94%{width:792px}100%{width:0}}
.l7{animation:t7 18.0s infinite steps(36);}
@keyframes t8{0%,49.44%{width:0}58.19%,94%{width:792px}100%{width:0}}
.l8{animation:t8 18.0s infinite steps(35);}
@keyframes t9{0%,55.28%{width:0}61.03%,94%{width:792px}100%{width:0}}
.l9{animation:t9 18.0s infinite steps(23);}
@keyframes t10{0%,61.11%{width:0}69.61%,94%{width:792px}100%{width:0}}
.l10{animation:t10 18.0s infinite steps(34);}
@keyframes cs{0%,66.94%{opacity:0}67.04%,94%{opacity:1}100%{opacity:0}}
.curwrap{animation:cs 18.0s infinite steps(1);}
</style>

<defs>
  <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
  </radialGradient>
  <radialGradient id="phos" cx="50%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#06210f"/>
    <stop offset="100%" stop-color="#020b05"/>
  </radialGradient>
</defs>
<defs><clipPath id="c0"><rect class="typed l0" x="54" y="50" width="0" height="24"/></clipPath>
<clipPath id="c1"><rect class="typed l1" x="54" y="74" width="0" height="24"/></clipPath>
<clipPath id="c2"><rect class="typed l2" x="54" y="98" width="0" height="24"/></clipPath>
<clipPath id="c4"><rect class="typed l4" x="54" y="146" width="0" height="24"/></clipPath>
<clipPath id="c5"><rect class="typed l5" x="54" y="170" width="0" height="24"/></clipPath>
<clipPath id="c6"><rect class="typed l6" x="54" y="194" width="0" height="24"/></clipPath>
<clipPath id="c7"><rect class="typed l7" x="54" y="218" width="0" height="24"/></clipPath>
<clipPath id="c8"><rect class="typed l8" x="54" y="242" width="0" height="24"/></clipPath>
<clipPath id="c9"><rect class="typed l9" x="54" y="266" width="0" height="24"/></clipPath>
<clipPath id="c10"><rect class="typed l10" x="54" y="290" width="0" height="24"/></clipPath>
<clipPath id="scr"><rect x="34" y="34" width="832" height="312" rx="26"/></clipPath>
<linearGradient id="bez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfc8b4"/><stop offset="1" stop-color="#9d977f"/></linearGradient></defs>
<rect x="10" y="10" width="880" height="360" rx="38" fill="url(#bez)" stroke="#6f6a58" stroke-width="3"/>
<rect x="26" y="26" width="848" height="328" rx="32" fill="#1b1a16"/>
<rect x="34" y="34" width="832" height="312" rx="26" fill="url(#phos)"/>
<g class="flick">
<text x="54" y="68" font-size="17" clip-path="url(#c0)" filter="url(#glow)" xml:space="preserve">OWAIN-OS v1.0  (C) 1991 INITIALS LABS</text>
<text x="54" y="92" font-size="17" clip-path="url(#c1)" filter="url(#glow)" xml:space="preserve">MEMORY CHECK ........ 640K OK</text>
<text x="54" y="116" font-size="17" clip-path="url(#c2)" filter="url(#glow)" xml:space="preserve">LOADING PROFILE.SYS ... DONE</text>
<text x="54" y="164" font-size="17" clip-path="url(#c4)" filter="url(#glow)" xml:space="preserve">C:\&gt; LOGIN OWAINCODES</text>
<text x="54" y="188" font-size="17" clip-path="url(#c5)" filter="url(#glow)" xml:space="preserve">C:\&gt; TYPE WHOAMI.TXT</text>
<text x="54" y="212" font-size="17" clip-path="url(#c6)" filter="url(#glow)" xml:space="preserve">   NAME ...... OWAIN WILLIAMS</text>
<text x="54" y="236" font-size="17" clip-path="url(#c7)" filter="url(#glow)" xml:space="preserve">   ROLE ...... SENIOR .NET DEVELOPER</text>
<text x="54" y="260" font-size="17" clip-path="url(#c8)" filter="url(#glow)" xml:space="preserve">   FOCUS ..... UMBRACO / .NET / OSS</text>
<text x="54" y="284" font-size="17" clip-path="url(#c9)" filter="url(#glow)" xml:space="preserve">   LOCATION .. SCOTLAND</text>
<text x="54" y="308" font-size="17" clip-path="url(#c10)" filter="url(#glow)" xml:space="preserve">   STATUS .... OPEN TO COLLABORATE</text>
<g class="curwrap"><text x="54" y="332" font-size="17" filter="url(#glow)">C:\&gt;</text><rect class="cur" x="100" y="317" width="11" height="18" fill="#33ff66" filter="url(#glow)"/></g>

<g clip-path="url(#scr)" style="pointer-events:none">
  <g class="roll"><rect x="34" y="26" width="832" height="328" fill="url(#scan)"/></g>
  <rect x="34" y="34" width="832" height="312" fill="url(#vig)"/>
  <rect class="sweep" x="34" y="34" width="832" height="40" fill="#33ff66" opacity="0.05"/>
</g>
</g>
<circle cx="848" cy="358" r="4" fill="#33ff66" class="cur"/>
</svg>